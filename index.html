<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Expense Splitter — Shared Rooms (INR)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#1f6feb"/>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <style>
    /* (Same styling as before; trimmed for brevity) */
    :root { --accent: #1f6feb; --muted:#666; --card:#fff; --bg:#f4f7fb; --danger:#e53e3e; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;}
    html,body{height:100%;margin:0;background:var(--bg);color:#111}
    .wrap{max-width:980px;margin:28px auto;padding:20px}
    header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
    header h1{margin:0;font-size:20px}
    .card{background:var(--card);border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 6px 18px rgba(34,40,56,0.06)}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    input,select,textarea{padding:8px;border-radius:8px;border:1px solid #d6dce9}
    button{background:var(--accent);color:#fff;border:none;padding:8px 12px;border-radius:8px;cursor:pointer}
    button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
    .small{font-size:13px;color:var(--muted)}
    table{width:100%;border-collapse:collapse}
    th,td{padding:8px;border-bottom:1px solid #f0f2f6}
    .right{text-align:right}
    .person-pill{padding:8px 10px;border-radius:20px;background:#f1f6ff;border:1px solid #dce9ff;display:inline-flex;gap:8px;align-items:center}
    .install-bar{position:fixed;right:18px;bottom:18px}
    .status{font-size:13px;color:var(--muted)}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Expense Splitter — Shared Rooms</h1>
        <div class="small">Share the room URL to let friends join and edit the same data.</div>
      </div>
      <div style="margin-left:auto;text-align:right">
        <div id="room-controls" class="small"></div>
        <div id="connection-status" class="status"></div>
      </div>
    </header>

    <section class="card">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <button id="create-room">Create room</button>
        <button id="copy-link" class="ghost" style="display:none">Copy room link</button>
        <button id="leave-room" class="ghost" style="display:none">Leave room</button>
        <button id="work-local" class="ghost">Work locally</button>
        <div id="share-hint" class="small"></div>
      </div>
    </section>

    <!-- People card -->
    <section class="card" id="people-card">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <label for="person-name">Add person</label>
        <input id="person-name" type="text" placeholder="e.g., Aman" />
        <button id="add-person">Add</button>
        <div class="small">Max 10 people</div>
      </div>
      <div id="people-list" style="margin-top:10px"></div>
    </section>

    <!-- Transaction card -->
    <section class="card" id="transaction-card" style="display:none">
      <h3 style="margin:0 0 8px 0">Add transaction</h3>
      <div class="row">
        <div><label>Date</label><br/><input id="txn-date" type="date" /></div>
        <div style="min-width:220px"><label>Description</label><br/><input id="txn-desc" type="text" /></div>
        <div><label>Amount (INR)</label><br/><input id="txn-amount" type="number" step="0.01" min="0" /></div>
        <div><label>Payer</label><br/><select id="txn-payer"></select></div>
      </div>
      <div style="margin-top:10px">
        <label>Participants</label>
        <div id="participants" style="display:flex;gap:8px;flex-wrap:wrap"></div>
        <div class="small">Selected participants split equally.</div>
      </div>
      <div style="margin-top:10px">
        <button id="add-transaction">Add transaction</button>
      </div>

      <div style="margin-top:14px">
        <h4 style="margin:0 0 6px 0">Transactions</h4>
        <div id="tx-table-wrap"></div>
      </div>
    </section>

    <section class="card" id="summary-card" style="display:none">
      <h3 style="margin:0 0 8px 0">Summary</h3>
      <div id="person-balances"></div>
      <div style="margin-top:8px">
        <h4 style="margin:0 0 6px 0">Minimal settlements</h4>
        <div id="settlements-output"></div>
      </div>
    </section>

    <section class="card">
      <div style="display:flex;gap:8px;align-items:center">
        <button id="export-json" class="ghost">Export JSON</button>
        <button id="import-json" class="ghost">Import JSON</button>
        <button id="reset-all" class="ghost">Reset</button>
        <input id="import-file" type="file" accept="application/json" style="display:none" />
      </div>
      <div class="small" style="margin-top:8px">Export/Import helps move a room snapshot manually if needed.</div>
    </section>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyB_mNbEHIdXsx0BPzXf_wsGsOzVzjsIGak",
  authDomain: "splitapp-8eb08.firebaseapp.com",
  projectId: "splitapp-8eb08",
  storageBucket: "splitapp-8eb08.firebasestorage.app",
  messagingSenderId: "833724475626",
  appId: "1:833724475626:web:51ec55148ed2e3ab278f93"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.firestore();

    // Enable offline persistence (best-effort)
    db.enablePersistence().catch(err => {
      console.warn('Persistence error', err && err.code);
    });

    // Sign in anonymously so Firestore rules requiring auth work
    auth.onAuthStateChanged(user => {
      if (!user) {
        auth.signInAnonymously().catch(err => console.error('Auth error', err));
      }
    });

    // Utility formatting
    function formatINR(paise) {
      const sign = paise < 0 ? "-" : "";
      const abs = Math.abs(paise);
      const rupees = Math.floor(abs / 100);
      const pennies = abs % 100;
      return sign + "₹" + rupees.toLocaleString('en-IN') + "." + (pennies<10 ? "0"+pennies : pennies);
    }
    function uid(prefix='id') { return prefix + '_' + Math.random().toString(36).slice(2,9); }
    function escapeHtml(s){ if(!s) return ''; return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
    function qs() { return new URLSearchParams(location.search); }

    // App state and local persistence key
    const STATE_KEY = 'expenseSplitterState_v1_shared';
    const state = { people: [], transactions: [] };

    // DOM refs
    const personNameInput = document.getElementById('person-name');
    const addPersonBtn = document.getElementById('add-person');
    const peopleListEl = document.getElementById('people-list');
    const txnCard = document.getElementById('transaction-card');
    const txnDate = document.getElementById('txn-date');
    const txnDesc = document.getElementById('txn-desc');
    const txnAmount = document.getElementById('txn-amount');
    const txnPayer = document.getElementById('txn-payer');
    const participantsBox = document.getElementById('participants');
    const addTxnBtn = document.getElementById('add-transaction');
    const txTableWrap = document.getElementById('tx-table-wrap');
    const summaryCard = document.getElementById('summary-card');
    const personBalancesEl = document.getElementById('person-balances');
    const settlementsOutput = document.getElementById('settlements-output');

    const createRoomBtn = document.getElementById('create-room');
    const copyLinkBtn = document.getElementById('copy-link');
    const leaveRoomBtn = document.getElementById('leave-room');
    const workLocalBtn = document.getElementById('work-local');
    const roomControls = document.getElementById('room-controls');
    const connectionStatus = document.getElementById('connection-status');
    const exportBtn = document.getElementById('export-json');
    const importBtn = document.getElementById('import-json');
    const importFileInput = document.getElementById('import-file');
    const resetAllBtn = document.getElementById('reset-all');

    // Room management
    let currentRoomId = null;
    let roomUnsubscribe = null;
    let isApplyingRemote = false;
    let pushTimer = null;

    function saveLocal() { try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch(e){ console.warn(e); } }
    function loadLocal() {
      try {
        const raw = localStorage.getItem(STATE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.people) && Array.isArray(parsed.transactions)) {
          state.people = parsed.people;
          state.transactions = parsed.transactions;
        }
      } catch(e) { console.warn('loadLocal', e); }
    }

    // Apply remote snapshot without pushing it back immediately
    function applyRemoteState(remoteState) {
      isApplyingRemote = true;
      // Overwrite local state with remote
      state.people = remoteState.people || [];
      state.transactions = remoteState.transactions || [];
      refreshUI(); // this will call saveLocal but we avoid pushing to server by isApplyingRemote flag
      isApplyingRemote = false;
    }

    // Create random long room id (use crypto for randomness)
    function makeRoomId(len=24) {
      const arr = new Uint8Array(len);
      crypto.getRandomValues(arr);
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      return Array.from(arr).map(b => chars[b % chars.length]).join('');
    }

    // Push local state to Firestore (debounced)
    function schedulePushToRoom() {
      if (!currentRoomId || isApplyingRemote) return;
      if (pushTimer) clearTimeout(pushTimer);
      pushTimer = setTimeout(pushNowToRoom, 800);
    }
    async function pushNowToRoom() {
      if (!currentRoomId) return;
      try {
        await db.collection('rooms').doc(currentRoomId).set({
          state: state,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });
        //console.log('Pushed to room', currentRoomId);
      } catch (err) {
        console.warn('Push error', err);
      }
    }

    // Join a room and listen for realtime changes
    function joinRoom(roomId) {
      leaveRoom(); // clear any current
      currentRoomId = roomId;
      roomControls.innerHTML = 'Room: <strong>' + escapeHtml(roomId) + '</strong>';
      copyLinkBtn.style.display = 'inline-block';
      leaveRoomBtn.style.display = 'inline-block';
      workLocalBtn.style.display = 'inline-block';
      // Listen to changes on the room doc
      const docRef = db.collection('rooms').doc(roomId);
      roomUnsubscribe = docRef.onSnapshot(snap => {
        if (snap.exists) {
          const data = snap.data();
          if (data && data.state) {
            applyRemoteState(data.state);
          }
        } else {
          // No room yet — push current local state to create it
          if (!isApplyingRemote) {
            pushNowToRoom();
          }
        }
      }, err => {
        console.error('Room snapshot error', err);
        connectionStatus.textContent = 'Realtime error';
      });
      connectionStatus.textContent = 'Connected to room (realtime)';
    }

    function leaveRoom() {
      if (roomUnsubscribe) {
        roomUnsubscribe();
        roomUnsubscribe = null;
      }
      currentRoomId = null;
      roomControls.textContent = '';
      copyLinkBtn.style.display = 'none';
      leaveRoomBtn.style.display = 'none';
      connectionStatus.textContent = 'Working locally';
    }

    // UI rendering
    function renderPeople() {
      peopleListEl.innerHTML = '';
      txnPayer.innerHTML = '';
      participantsBox.innerHTML = '';
      state.people.forEach(p => {
        const pill = document.createElement('div');
        pill.className = 'person-pill';
        pill.innerHTML = `<span>${escapeHtml(p.name)}</span>`;
        const delBtn = document.createElement('button');
        delBtn.textContent = '✕'; delBtn.title = 'Remove';
        delBtn.style.background='transparent'; delBtn.style.border='none'; delBtn.style.cursor='pointer';
        delBtn.addEventListener('click', () => {
          if (!confirm('Remove ' + p.name + '? This will remove any transactions involving them.')) return;
          state.people = state.people.filter(x => x.id !== p.id);
          state.transactions = state.transactions.filter(t => t.payerId !== p.id && !t.participantIds.includes(p.id));
          onLocalChange();
        });
        pill.appendChild(delBtn);
        peopleListEl.appendChild(pill);

        const opt = document.createElement('option'); opt.value = p.id; opt.textContent = p.name;
        txnPayer.appendChild(opt);

        const chkWrap = document.createElement('label'); chkWrap.style.display='inline-flex'; chkWrap.style.alignItems='center';
        chkWrap.style.padding='4px 8px'; chkWrap.style.borderRadius='8px'; chkWrap.style.border='1px solid #eee'; chkWrap.style.marginRight='6px';
        const inp = document.createElement('input'); inp.type='checkbox'; inp.value=p.id; inp.checked=true;
        chkWrap.appendChild(inp); chkWrap.appendChild(document.createTextNode(p.name));
        participantsBox.appendChild(chkWrap);
      });

      if (state.people.length > 0) {
        txnCard.style.display = 'block';
        summaryCard.style.display = 'block';
      } else {
        txnCard.style.display = 'none';
        summaryCard.style.display = 'none';
      }
    }

    function renderTransactions() {
      if (state.transactions.length === 0) {
        txTableWrap.innerHTML = '<div class="small">No transactions yet.</div>';
        return;
      }
      let html = `<table><thead><tr><th>Date</th><th>Description</th><th>Payer</th><th>Participants</th><th class="right">Amount</th><th></th></tr></thead><tbody>`;
      state.transactions.slice().reverse().forEach(tx => {
        const payer = state.people.find(p=>p.id===tx.payerId);
        const participants = tx.participantIds.map(id => (state.people.find(p=>p.id===id)||{}).name||'?').join(', ');
        html += `<tr>
          <td>${escapeHtml(tx.date)}</td>
          <td>${escapeHtml(tx.desc)}</td>
          <td>${escapeHtml(payer ? payer.name : 'Unknown')}</td>
          <td>${escapeHtml(participants)}</td>
          <td class="right">${formatINR(tx.amountPaise)}</td>
          <td class="right"><button data-id="${tx.id}" class="del-tx ghost">Delete</button></td>
        </tr>`;
      });
      html += '</tbody></table>';
      txTableWrap.innerHTML = html;
      txTableWrap.querySelectorAll('.del-tx').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-id');
          if (!confirm('Delete transaction?')) return;
          state.transactions = state.transactions.filter(t => t.id !== id);
          onLocalChange();
        });
      });
    }

    function computeBalances() {
      const balances = {};
      state.people.forEach(p => balances[p.id] = 0);
      state.transactions.forEach(tx => {
        balances[tx.payerId] = (balances[tx.payerId]||0) + tx.amountPaise;
        tx.participantIds.forEach(pid => {
          const share = tx.sharesPaise[pid] || 0;
          balances[pid] = (balances[pid]||0) - share;
        });
      });
      return balances;
    }

    function computeSettlements(balancesMap) {
      const creditors = []; const debtors = [];
      for (const id in balancesMap) {
        const b = balancesMap[id];
        if (b > 0) creditors.push({id,amount:b});
        else if (b < 0) debtors.push({id,amount:-b});
      }
      creditors.sort((a,b)=>b.amount-a.amount);
      debtors.sort((a,b)=>b.amount-a.amount);
      const settlements = [];
      let i=0,j=0;
      while(i<debtors.length && j<creditors.length){
        const d=debtors[i], c=creditors[j];
        const settle = Math.min(d.amount,c.amount);
        settlements.push({fromId:d.id,toId:c.id,amountPaise:settle});
        d.amount -= settle; c.amount -= settle;
        if (d.amount === 0) i++; if (c.amount === 0) j++;
      }
      return settlements;
    }

    function renderSummary() {
      const balances = computeBalances();
      if (state.people.length === 0) { personBalancesEl.innerHTML=''; settlementsOutput.innerHTML=''; return; }
      let html = `<table><thead><tr><th>Person</th><th class="right">Net</th></tr></thead><tbody>`;
      state.people.forEach(p => {
        const b = balances[p.id]||0;
        const cls = b>0 ? 'balance-positive' : (b<0 ? 'balance-negative' : '');
        html += `<tr><td>${escapeHtml(p.name)}</td><td class="right ${cls}">${formatINR(b)}</td></tr>`;
      });
      html += '</tbody></table>'; personBalancesEl.innerHTML = html;
      const sets = computeSettlements(balances);
      if (!sets.length) { settlementsOutput.innerHTML = '<div class="small">All settled</div>'; return; }
      let shtml = `<table><thead><tr><th>From</th><th>To</th><th class="right">Amount</th></tr></thead><tbody>`;
      sets.forEach(s => {
        shtml += `<tr><td>${escapeHtml((state.people.find(p=>p.id===s.fromId)||{}).name || '?')}</td><td>${escapeHtml((state.people.find(p=>p.id===s.toId)||{}).name || '?')}</td><td class="right">${formatINR(s.amountPaise)}</td></tr>`;
      });
      shtml += '</tbody></table>'; settlementsOutput.innerHTML = shtml;
    }

    // UI actions that modify local state should call this
    function onLocalChange() {
      saveLocal();
      if (!isApplyingRemote) schedulePushToRoom();
      refreshUI();
    }

    function refreshUI() {
      renderPeople();
      renderTransactions();
      renderSummary();
    }

    // Form handlers
    addPersonBtn.addEventListener('click', () => {
      const name = personNameInput.value.trim();
      if (!name) { alert('Enter a name'); return; }
      if (state.people.length >= 10) { alert('Max 10 people'); return; }
      if (state.people.some(p => p.name.toLowerCase()===name.toLowerCase())) { alert('Duplicate'); return; }
      state.people.push({ id: uid('p'), name });
      personNameInput.value='';
      onLocalChange();
    });
    personNameInput.addEventListener('keydown', e => { if (e.key==='Enter') addPersonBtn.click(); });

    addTxnBtn.addEventListener('click', () => {
      if (!state.people.length) { alert('Add people first'); return; }
      const date = txnDate.value || new Date().toISOString().slice(0,10);
      const desc = txnDesc.value.trim() || '(no description)';
      const raw = txnAmount.value;
      if (!raw || isNaN(raw) || Number(raw) <= 0) { alert('Enter amount'); return; }
      const amountPaise = Math.round(Number(raw) * 100);
      const payerId = txnPayer.value;
      const participantInputs = Array.from(participantsBox.querySelectorAll('input[type="checkbox"]'));
      const participantIds = participantInputs.filter(i => i.checked).map(i => i.value);
      if (!participantIds.length) { alert('Select participants'); return; }
      const base = Math.floor(amountPaise / participantIds.length);
      let rem = amountPaise - base * participantIds.length;
      const sharesPaise = {};
      participantIds.forEach(pid => {
        const add = rem > 0 ? 1 : 0;
        sharesPaise[pid] = base + add;
        if (add) rem--;
      });
      const tx = { id: uid('t'), date, desc, amountPaise, payerId, participantIds: participantIds.slice(), sharesPaise, createdAt: new Date().toISOString() };
      state.transactions.push(tx);
      txnDesc.value=''; txnAmount.value='';
      onLocalChange();
    });

    resetAllBtn.addEventListener('click', () => {
      if (!confirm('Reset all data?')) return;
      state.people=[]; state.transactions=[];
      onLocalChange();
    });

    // Export / Import
    exportBtn.addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'expense-splitter-export.json';
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    });
    importBtn.addEventListener('click', () => importFileInput.click());
    importFileInput.addEventListener('change', e => {
      const f = e.target.files[0]; if (!f) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (parsed && Array.isArray(parsed.people) && Array.isArray(parsed.transactions)) {
            if (!confirm('Import will replace current data. Continue?')) return;
            state.people = parsed.people; state.transactions = parsed.transactions;
            onLocalChange(); alert('Import done');
          } else alert('Invalid file');
        } catch(err) { alert('Failed to parse: ' + err); }
      };
      reader.readAsText(f);
    });

    // Create/join/leave room buttons
    createRoomBtn.addEventListener('click', () => {
      const id = makeRoomId(28);
      const url = new URL(location.href);
      url.searchParams.set('room', id);
      // navigate to new room
      location.href = url.toString();
    });
    copyLinkBtn.addEventListener('click', async () => {
      const url = location.href;
      try {
        await navigator.clipboard.writeText(url);
        alert('Room link copied');
      } catch(e) {
        prompt('Copy this URL', url);
      }
    });
    leaveRoomBtn.addEventListener('click', () => {
      if (!confirm('Leave room and work locally?')) return;
      const url = new URL(location.href);
      url.searchParams.delete('room');
      location.href = url.toString(); // reload without room
    });
    workLocalBtn.addEventListener('click', () => {
      const url = new URL(location.href);
      url.searchParams.delete('room');
      location.href = url.toString();
    });

    // On load: restore local state, read room param, and join room if present
    (function init(){
      txnDate.value = new Date().toISOString().slice(0,10);
      loadLocal();
      const params = qs();
      const room = params.get('room');
      if (room) {
        // ensure signed in before joining
        auth.onAuthStateChanged(u => {
          if (u) {
            joinRoom(room);
            copyLinkBtn.style.display='inline-block';
            leaveRoomBtn.style.display='inline-block';
            roomControls.textContent = 'Room: ' + room;
            refreshUI();
          }
        });
      } else {
        connectionStatus.textContent = 'Working locally (no room)';
        refreshUI();
      }

      // Monitor connection state (basic)
      const connectedRef = firebase.database ? firebase.database().ref('.info/connected') : null;
      // Firestore doesn't have a simple connected-to-backend flag in web SDK; we just show auth state for now
      auth.onAuthStateChanged(u => {
        connectionStatus.textContent = u ? 'Signed in (anonymous)' : 'Not signed in';
      });
    })();

    // Save local on unload as an extra precaution
    window.addEventListener('beforeunload', () => saveLocal());
  </script>
</body>
</html>
